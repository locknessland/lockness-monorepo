# Quality gates for the Specnaut epic loop.
#
# `run-gate.sh <fast|full>` reads a tier from here and `eval`s each entry in a
# subshell from the repository root, stopping at the first non-zero exit. An
# entry may chain with `&&`. An absent file or an empty tier is a no-op, not a
# failure.
#
# These tiers differ by FREQUENCY, not thoroughness. Nothing here runs in CI —
# `.github/workflows/test.yml` and the git hooks are unchanged and remain the
# real gate before a push.

# After every child commit inside an epic. Kept to what is fast and offline:
# roughly a second, no network. These three catch the overwhelming majority of
# what breaks between one child and the next.
fast_gate:
  - deno fmt --check && deno lint && deno check

# Once, before the epic merges. Adds the three checks that need the network or
# a full workspace walk, and the suite.
#
#   deps:analyze     re-runs `deno info` over every package
#   agents:brief     regenerates and compares every package brief
#   publish:check    copies all 27 packages out of the workspace, hits JSR
#
# Running those after each child would cost far more than they catch there.
full_gate:
  - deno fmt --check && deno lint && deno check
  - deno task deps:analyze
  - deno task agents:brief --check
  - deno task publish:check
  - deno task test
