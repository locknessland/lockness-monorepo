# Quality gates for the Specnaut epic loop.
#
# `run-gate.sh <fast|full>` reads a tier from here and `eval`s each entry in a
# subshell from the repository root, stopping at the first non-zero exit. An
# entry may chain with `&&`. An absent file or an empty tier is a no-op, not a
# failure.
#
# These tiers differ by FREQUENCY, not thoroughness. `fast_gate` is a speed
# subset of the real gate, not a copy of it; `full_gate` IS the real gate —
# `deno task gate`, which the pre-push hook and CI run too.

# After every child commit inside an epic. Kept to what is fast and offline:
# roughly a second, no network. These three catch the overwhelming majority of
# what breaks between one child and the next.
fast_gate:
  - deno fmt --check && deno lint && deno check

# Once, before the epic merges: the project's one versioned gate, the same task
# the pre-push hook and CI run. Its step list lives in `scripts/gate.ts` only —
# a copy here drifted (#388). It adds the checks that need the network or a
# full workspace walk, and the suite; running those after each child would cost
# far more than they catch there.
full_gate:
  - deno task gate
