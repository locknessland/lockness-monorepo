name: Secret scan

# Secret scanning with the gitleaks CLI. Every run checks out the FULL history
# (fetch-depth: 0) and scans every commit reachable from HEAD, so each push and
# each pull request re-sweeps the whole history, not just the incoming diff.
#
# The CLI runs directly rather than through gitleaks/gitleaks-action: the
# action refuses to run on an organization-owned repository without a license
# key, so it never scanned anything here (#390). The CLI is open source and
# needs no key and no token.
#
# Supply chain: the release is pinned by version AND by its per-platform
# sha256, both in scripts/gitleaks_manifest.json — the one manifest this
# workflow (via `jq`, no Deno needed for a scan-only job) and the local
# pre-push hook (`scripts/install_gitleaks.ts`, via `with { type: 'json' }`)
# both read. Bump the version only in that JSON file. The hash below is
# checked against that literal value, never against the release's own
# checksums file (which would travel with a tampered tarball).
#
# Known false positives are suppressed by fingerprint in .gitleaksignore
# (commit:file:rule:line), and only there: inline `gitleaks:allow` comments
# are ignored and a repository-level .gitleaks.toml fails the job. Never
# allowlist a whole path.
#
# .gitleaksignore is read as it stood at the push/PR's BASE, never at the tip
# (#HIGH): otherwise one push (or one same-branch PR) could add a secret in
# one commit and its own suppressing fingerprint in a later commit, and this
# scan would see the tip's already-suppressed version and pass. gitleaks reads
# .gitleaksignore live off the scan's working directory (verified against the
# real binary — its `--gitleaks-ignore-path` flag does NOT override a file
# already present there), so the checked-out `.gitleaksignore` is temporarily
# overwritten with the base's content before scanning, and restored after —
# see `scripts/prepush_secret_scan.ts`'s module docs for the same mechanism
# used locally. The base is `github.event.pull_request.base.sha` for a pull
# request, or `github.event.before` for a push; `workflow_dispatch`, or a
# `before` of all zeros (a new branch's first push), keeps the tip's file —
# the one named residue of this rule, same as locally.
#
# Fail closed: gitleaks exits 0 when its own git subprocess fails (bad ref,
# not a repository), having scanned nothing. The scan step therefore also
# fails on any ERR/FTL log line, on "0 commits scanned", on an unreadable
# report, and on a non-empty report paired with a zero exit status.

on:
    push:
        branches:
            - main
            - develop
    pull_request:
        branches:
            - main
            - develop
    workflow_dispatch: {}

permissions:
    contents: read

jobs:
    gitleaks:
        name: gitleaks
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: Checkout (full history)
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
              with:
                  fetch-depth: 0 # scan the entire history, not just the tip
                  persist-credentials: false

            - name: Install gitleaks (verified against scripts/gitleaks_manifest.json)
              id: verify
              shell: bash
              run: |
                  set -euo pipefail
                  manifest="scripts/gitleaks_manifest.json"
                  version="$(jq -r '.version' "${manifest}")"
                  sha256="$(jq -r '.sha256.linux_x64' "${manifest}")"
                  tarball="gitleaks_${version}_linux_x64.tar.gz"
                  dest="${RUNNER_TEMP}/gitleaks"
                  mkdir -p "${dest}"
                  curl --fail --silent --show-error --location --retry 3 \
                      --output "${dest}/${tarball}" \
                      "https://github.com/gitleaks/gitleaks/releases/download/v${version}/${tarball}"
                  echo "${sha256}  ${dest}/${tarball}" | sha256sum -c -
                  tar -xzf "${dest}/${tarball}" -C "${dest}" gitleaks
                  "${dest}/gitleaks" version
                  echo "${dest}" >> "${GITHUB_PATH}"

            - name: Scan full history
              id: scan
              shell: bash
              env:
                  GH_EVENT_NAME: ${{ github.event_name }}
                  PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
                  PUSH_BEFORE_SHA: ${{ github.event.before }}
              run: |
                  set -euo pipefail

                  # Suppression lives in .gitleaksignore only (see header).
                  test ! -e .gitleaks.toml || {
                      echo "::error::.gitleaks.toml is not allowed: it could silence findings. Suppress a reviewed false positive by fingerprint in .gitleaksignore instead."
                      exit 1
                  }

                  # Read from the installed binary rather than a workflow
                  # literal — scripts/gitleaks_manifest.json is the one pin.
                  gitleaks_version="$(gitleaks version)"

                  # Base-snapshot .gitleaksignore (see header): read the base's
                  # version, and overwrite the checked-out working copy with it
                  # for the duration of the scan only. gitleaks reads the file
                  # live off disk, not from a git blob.
                  base_sha=""
                  zero_sha_re='^0+$'
                  if [ "${GH_EVENT_NAME}" = "pull_request" ] && [ -n "${PR_BASE_SHA}" ]; then
                      base_sha="${PR_BASE_SHA}"
                  elif [ "${GH_EVENT_NAME}" = "push" ] && [ -n "${PUSH_BEFORE_SHA}" ] && ! [[ "${PUSH_BEFORE_SHA}" =~ $zero_sha_re ]]; then
                      base_sha="${PUSH_BEFORE_SHA}"
                  fi

                  original_ignore="${RUNNER_TEMP}/gitleaksignore.original"
                  had_original=0
                  if [ -e .gitleaksignore ]; then
                      had_original=1
                      cp .gitleaksignore "${original_ignore}"
                  fi
                  restore_ignore() {
                      if [ "${had_original}" -eq 1 ]; then
                          cp "${original_ignore}" .gitleaksignore
                      else
                          rm -f .gitleaksignore
                      fi
                  }
                  trap restore_ignore EXIT

                  if [ -n "${base_sha}" ] && git cat-file -e "${base_sha}" 2>/dev/null; then
                      git show "${base_sha}:.gitleaksignore" > .gitleaksignore 2>/dev/null || : > .gitleaksignore
                  fi
                  # else: workflow_dispatch, or a genuinely new branch's first
                  # push (before is all zeros) — keep the tip's file, the one
                  # named residue.

                  report="${RUNNER_TEMP}/gitleaks-report.json"
                  log="${RUNNER_TEMP}/gitleaks.log"
                  status=0
                  gitleaks git --redact --no-banner --no-color \
                      --ignore-gitleaks-allow --exit-code 1 \
                      --log-opts=HEAD \
                      --report-format json --report-path "${report}" \
                      . 2>&1 | tee "${log}" || status=$?

                  count="unknown"
                  if [ -s "${report}" ]; then
                      count="$(jq 'length' "${report}" 2>/dev/null)" || count="unknown"
                  fi
                  scanned="$(grep -Eo '[0-9]+ commits scanned' "${log}" | grep -Eo '^[0-9]+' || true)"

                  # gitleaks exits 0 when its git subprocess fails; fail closed.
                  problems=()
                  if grep -Eq '\b(ERR|FTL)\b' "${log}"; then
                      problems+=("gitleaks logged an ERR/FTL line")
                  fi
                  if grep -Eq '(^|[^0-9])0 commits scanned' "${log}"; then
                      problems+=("gitleaks scanned 0 commits")
                  fi
                  if [ "${count}" = "unknown" ]; then
                      problems+=("the gitleaks report is missing or unreadable")
                  elif [ "${count}" != "0" ] && [ "${status}" -eq 0 ]; then
                      problems+=("the report holds ${count} leak(s) but gitleaks exited 0")
                  fi
                  if [ "${#problems[@]}" -gt 0 ]; then
                      for problem in "${problems[@]}"; do
                          echo "::error::Secret scan failed closed: ${problem}"
                      done
                      if [ "${status}" -eq 0 ]; then
                          status=1
                      fi
                  fi

                  {
                      echo "## Secret scan (gitleaks ${gitleaks_version})"
                      echo
                      echo "Commits scanned: **${scanned:-unknown}**"
                      echo "Leaks found: **${count}** (exit status ${status})"
                      for problem in "${problems[@]}"; do
                          echo "- Failed closed: ${problem}"
                      done
                      if [ "${count}" != "unknown" ] && [ "${count}" != "0" ]; then
                          echo
                          echo "Values are redacted. Fingerprints (commit:file:rule:line):"
                          echo
                          echo '```text'
                          jq -r '.[].Fingerprint' "${report}"
                          echo '```'
                          echo
                          echo "If this is a false positive: push the offending commit first, then add its .gitleaksignore entry in a follow-up push/PR — an entry added in the SAME push/PR is not honoured (it is read as it stood at the base, not the tip)."
                      fi
                  } >> "${GITHUB_STEP_SUMMARY}"

                  exit "${status}"
