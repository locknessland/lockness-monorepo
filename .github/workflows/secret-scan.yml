name: Secret scan

# Continuous secret scanning with gitleaks. A scheduled or manually-dispatched
# run checks out the FULL history (fetch-depth: 0) and scans every commit, so
# the first such run also serves as the one-time historical sweep the
# 2026-09-04 security audit recommended (#171). Push/PR runs scan the incoming
# commits.

on:
    push:
        branches:
            - main
            - develop
    pull_request:
        branches:
            - main
            - develop
    schedule:
        - cron: '0 6 * * 1' # weekly, Monday 06:00 UTC — full-history sweep
    workflow_dispatch: {}

permissions:
    contents: read

jobs:
    gitleaks:
        name: gitleaks
        runs-on: ubuntu-latest
        steps:
            - name: Checkout (full history)
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
              with:
                  fetch-depth: 0 # scan the entire history, not just the tip

            - name: Run gitleaks
              uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  # Public repositories scan for free. A private or org repo
                  # requires a GITLEAKS_LICENSE secret; referencing it here is
                  # harmless when it is unset on a public repo.
                  GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
