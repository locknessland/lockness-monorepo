name: Secret scan

# Secret scanning with the gitleaks CLI. Every run checks out the FULL history
# (fetch-depth: 0) and scans every commit reachable from HEAD, so each push and
# each pull request re-sweeps the whole history, not just the incoming diff.
#
# The CLI runs directly rather than through gitleaks/gitleaks-action: the
# action refuses to run on an organization-owned repository without a license
# key, so it never scanned anything here (#390). The CLI is open source and
# needs no key and no token.
#
# Supply chain: the release tarball is pinned by version AND by its sha256,
# both written as literals below. The hash is checked against that literal,
# never against the release's own checksums file (which would travel with a
# tampered tarball). To upgrade, change both values together, copying the
# sha256 from the official gitleaks release page.
#
# Known false positives are suppressed by fingerprint in .gitleaksignore
# (commit:file:rule:line), and only there: inline `gitleaks:allow` comments
# are ignored and a repository-level .gitleaks.toml fails the job. Never
# allowlist a whole path.
#
# Fail closed: gitleaks exits 0 when its own git subprocess fails (bad ref,
# not a repository), having scanned nothing. The scan step therefore also
# fails on any ERR/FTL log line, on "0 commits scanned", on an unreadable
# report, and on a non-empty report paired with a zero exit status.

on:
    push:
        branches:
            - main
            - develop
    pull_request:
        branches:
            - main
            - develop
    workflow_dispatch: {}

permissions:
    contents: read

jobs:
    gitleaks:
        name: gitleaks
        runs-on: ubuntu-latest
        timeout-minutes: 10
        env:
            GITLEAKS_VERSION: '8.30.1'
            GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
        steps:
            - name: Checkout (full history)
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
              with:
                  fetch-depth: 0 # scan the entire history, not just the tip
                  persist-credentials: false

            - name: Install gitleaks (verify checksum)
              id: verify
              shell: bash
              run: |
                  set -euo pipefail
                  tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
                  dest="${RUNNER_TEMP}/gitleaks"
                  mkdir -p "${dest}"
                  curl --fail --silent --show-error --location --retry 3 \
                      --output "${dest}/${tarball}" \
                      "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
                  echo "${GITLEAKS_SHA256}  ${dest}/${tarball}" | sha256sum -c -
                  tar -xzf "${dest}/${tarball}" -C "${dest}" gitleaks
                  "${dest}/gitleaks" version
                  echo "${dest}" >> "${GITHUB_PATH}"

            - name: Scan full history
              id: scan
              shell: bash
              run: |
                  set -euo pipefail

                  # Suppression lives in .gitleaksignore only (see header).
                  test ! -e .gitleaks.toml || {
                      echo "::error::.gitleaks.toml is not allowed: it could silence findings. Suppress a reviewed false positive by fingerprint in .gitleaksignore instead."
                      exit 1
                  }

                  report="${RUNNER_TEMP}/gitleaks-report.json"
                  log="${RUNNER_TEMP}/gitleaks.log"
                  status=0
                  gitleaks git --redact --no-banner --no-color \
                      --ignore-gitleaks-allow --exit-code 1 \
                      --log-opts=HEAD \
                      --report-format json --report-path "${report}" \
                      . 2>&1 | tee "${log}" || status=$?

                  count="unknown"
                  if [ -s "${report}" ]; then
                      count="$(jq 'length' "${report}" 2>/dev/null)" || count="unknown"
                  fi
                  scanned="$(grep -Eo '[0-9]+ commits scanned' "${log}" | grep -Eo '^[0-9]+' || true)"

                  # gitleaks exits 0 when its git subprocess fails; fail closed.
                  problems=()
                  if grep -Eq '\b(ERR|FTL)\b' "${log}"; then
                      problems+=("gitleaks logged an ERR/FTL line")
                  fi
                  if grep -Eq '(^|[^0-9])0 commits scanned' "${log}"; then
                      problems+=("gitleaks scanned 0 commits")
                  fi
                  if [ "${count}" = "unknown" ]; then
                      problems+=("the gitleaks report is missing or unreadable")
                  elif [ "${count}" != "0" ] && [ "${status}" -eq 0 ]; then
                      problems+=("the report holds ${count} leak(s) but gitleaks exited 0")
                  fi
                  if [ "${#problems[@]}" -gt 0 ]; then
                      for problem in "${problems[@]}"; do
                          echo "::error::Secret scan failed closed: ${problem}"
                      done
                      if [ "${status}" -eq 0 ]; then
                          status=1
                      fi
                  fi

                  {
                      echo "## Secret scan (gitleaks ${GITLEAKS_VERSION})"
                      echo
                      echo "Commits scanned: **${scanned:-unknown}**"
                      echo "Leaks found: **${count}** (exit status ${status})"
                      for problem in "${problems[@]}"; do
                          echo "- Failed closed: ${problem}"
                      done
                      if [ "${count}" != "unknown" ] && [ "${count}" != "0" ]; then
                          echo
                          echo "Values are redacted. Fingerprints (commit:file:rule:line):"
                          echo
                          echo '```text'
                          jq -r '.[].Fingerprint' "${report}"
                          echo '```'
                      fi
                  } >> "${GITHUB_STEP_SUMMARY}"

                  exit "${status}"
