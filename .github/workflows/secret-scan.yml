name: Secret scan

# Secret scanning with the gitleaks CLI. Every run checks out the FULL history
# (fetch-depth: 0) and scans every commit reachable from HEAD, so each push and
# each pull request re-sweeps the whole history, not just the incoming diff.
#
# The CLI runs directly rather than through gitleaks/gitleaks-action: the
# action refuses to run on an organization-owned repository without a license
# key, so it never scanned anything here (#390). The CLI is open source and
# needs no key and no token.
#
# Supply chain: the release is pinned by version AND by its per-platform
# sha256, both in scripts/gitleaks_manifest.json — the one manifest this
# workflow (via `jq`, no Deno needed for a scan-only job) and the local
# pre-push hook (`scripts/install_gitleaks.ts`, via `with { type: 'json' }`)
# both read. Bump the version only in that JSON file. The hash below is
# checked against that literal value, never against the release's own
# checksums file (which would travel with a tampered tarball).
#
# Known false positives are suppressed by fingerprint in .gitleaksignore
# (commit:file:rule:line), and only there: inline `gitleaks:allow` comments
# are ignored and a repository-level .gitleaks.toml fails the job. Never
# allowlist a whole path.
#
# .gitleaksignore is read as it stood at the push/PR's BASE, never at the tip
# (#HIGH): otherwise one push (or one same-branch PR) could add a secret in
# one commit and its own suppressing fingerprint in a later commit, and a
# same-range scan would see the tip's already-suppressed version and pass.
# gitleaks reads .gitleaksignore live off the scan's working directory
# (verified against the real binary — its `--gitleaks-ignore-path` flag does
# NOT override a file already present there).
#
# That base-snapshot read has a cost of its own: a legitimate suppression push
# (one that only adds a fingerprint for an already-merged commit) also goes
# red, because it is scanned against the base's copy, which by definition
# lacks the new entry. Reading the base's file over the SAME full-history
# range would make every such push cost two red runs on main before the
# fingerprint takes effect. The scan is split into two runs instead, both
# required to pass:
#
#   1. "Scan history to base" — `--log-opts=<base>`, the base's own ancestry,
#      scanned with the checked-out (tip's) .gitleaksignore unchanged.
#   2. "Scan new range" — `--log-opts=<base>..HEAD`, scanned with the base's
#      .gitleaksignore (the pre-existing overwrite).
#
# The security argument: run 1 walks only the base's own ancestry, so it can
# never see a commit that exists only in the pushed range — a secret
# introduced by this push, and any fingerprint suppressing it, both live only
# in run 2's range, which is the one still scanned against the PRE-PUSH
# ignore file. A same-push secret-plus-suppression pair therefore still can't
# suppress itself; it just no longer also costs the legitimate,
# already-merged-commit suppression case a second red run. This assumes
# `main` and `develop` are fast-forward-only with no force-push — the
# invariant that keeps a resolved base an actual ancestor of the tip, and
# keeps a fork PR's base well-formed.
#
# With no base to split against (`workflow_dispatch`, or a `before` of all
# zeros on a branch's first push), there is nothing to split: one full scan
# runs instead, with the tip's file untouched — the one named residue of the
# base-snapshot rule, same as locally (see `scripts/prepush_secret_scan.ts`'s
# module docs). A base the event names but this checkout cannot reach, or
# that is not an ancestor of HEAD (a rewritten history), FAILS the job: it is
# never downgraded to the single scan, which would honour a same-push
# suppression.
#
# Accepted cost: run 1 re-scans the entire history on every push, so this
# roughly doubles gitleaks' total run time versus the single-scan shape.
#
# Fail closed: gitleaks exits 0 when its own git subprocess fails (bad ref,
# not a repository), having scanned nothing. Each run therefore also fails on
# any ERR/FTL log line, on an unreadable report, and on a non-empty report
# paired with a zero exit status. Run 1 additionally fails on "0 commits
# scanned" — it walks the base's own ancestry (or, with no base, the entire
# history), so a real zero is never legitimate there. Run 2 does NOT fail on
# "0 commits scanned": an empty new-range is legitimate (e.g. a re-push whose
# range collapses to nothing), so that check does not apply to it.

on:
    push:
        branches:
            - main
            - develop
    pull_request:
        branches:
            - main
            - develop
    workflow_dispatch: {}

permissions:
    contents: read

jobs:
    gitleaks:
        name: gitleaks
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - name: Checkout (full history)
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
              with:
                  fetch-depth: 0 # scan the entire history, not just the tip
                  persist-credentials: false

            - name: Install gitleaks (verified against scripts/gitleaks_manifest.json)
              id: verify
              shell: bash
              run: |
                  set -euo pipefail
                  manifest="scripts/gitleaks_manifest.json"
                  version="$(jq -r '.version' "${manifest}")"
                  sha256="$(jq -r '.sha256.linux_x64' "${manifest}")"
                  tarball="gitleaks_${version}_linux_x64.tar.gz"
                  dest="${RUNNER_TEMP}/gitleaks"
                  mkdir -p "${dest}"
                  curl --fail --silent --show-error --location --retry 3 \
                      --output "${dest}/${tarball}" \
                      "https://github.com/gitleaks/gitleaks/releases/download/v${version}/${tarball}"
                  echo "${sha256}  ${dest}/${tarball}" | sha256sum -c -
                  tar -xzf "${dest}/${tarball}" -C "${dest}" gitleaks
                  "${dest}/gitleaks" version
                  echo "${dest}" >> "${GITHUB_PATH}"

            - name: Refuse a shared .gitleaks.toml
              shell: bash
              run: |
                  set -euo pipefail
                  # Suppression lives in .gitleaksignore only (see header).
                  test ! -e .gitleaks.toml || {
                      echo "::error::.gitleaks.toml is not allowed: it could silence findings. Suppress a reviewed false positive by fingerprint in .gitleaksignore instead."
                      exit 1
                  }

            - name: Resolve base commit
              id: base
              shell: bash
              env:
                  GH_EVENT_NAME: ${{ github.event_name }}
                  PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
                  PUSH_BEFORE_SHA: ${{ github.event.before }}
              run: |
                  set -euo pipefail

                  # Same resolution as before the split (see header): the PR's
                  # base, or the push's pre-image, unless that is a genuinely
                  # new branch's first push (all-zero `before`). Resolved once
                  # here and shared with both scan steps via step outputs.
                  base_sha=""
                  zero_sha_re='^0+$'
                  if [ "${GH_EVENT_NAME}" = "pull_request" ] && [ -n "${PR_BASE_SHA}" ]; then
                      base_sha="${PR_BASE_SHA}"
                  elif [ "${GH_EVENT_NAME}" = "push" ] && [ -n "${PUSH_BEFORE_SHA}" ] && ! [[ "${PUSH_BEFORE_SHA}" =~ $zero_sha_re ]]; then
                      base_sha="${PUSH_BEFORE_SHA}"
                  fi

                  # "No base" (workflow_dispatch, a new branch's first push) is
                  # the named residue: one full scan on the tip's file. "A base
                  # that exists in the event but is not an ancestor of HEAD" is
                  # NOT that case: a rewritten or unfetchable base would drop
                  # the range check and let a same-push suppression through,
                  # so it fails the job instead of downgrading to one scan.
                  has_base=false
                  if [ -n "${base_sha}" ]; then
                      if ! git cat-file -e "${base_sha}^{commit}" 2>/dev/null; then
                          echo "::error::Secret scan failed closed: base ${base_sha} is not in this checkout (history rewritten or unfetchable); refusing to fall back to a single scan."
                          exit 1
                      fi
                      if ! git merge-base --is-ancestor "${base_sha}" HEAD; then
                          echo "::error::Secret scan failed closed: base ${base_sha} is not an ancestor of HEAD (history rewritten); refusing to fall back to a single scan."
                          exit 1
                      fi
                      has_base=true
                  fi

                  echo "sha=${base_sha}" >> "${GITHUB_OUTPUT}"
                  echo "has_base=${has_base}" >> "${GITHUB_OUTPUT}"

            - name: Scan history to base
              id: scan_base
              shell: bash
              env:
                  HAS_BASE: ${{ steps.base.outputs.has_base }}
                  BASE_SHA: ${{ steps.base.outputs.sha }}
              run: |
                  set -euo pipefail

                  gitleaks_version="$(gitleaks version)"

                  if [ "${HAS_BASE}" = "true" ]; then
                      log_opts="${BASE_SHA}"
                      label="history to base ${BASE_SHA}"
                  else
                      # No base to split against: workflow_dispatch, or a
                      # genuinely new branch's first push (before is all
                      # zeros). An unreachable base fails the job above.
                      # Nothing to split, so this is the one full scan — the
                      # named residue of the base-snapshot rule (see header).
                      # The tip's own .gitleaksignore is never touched either
                      # way: this run always uses the file as checked out.
                      log_opts="HEAD"
                      label="full history (no base — single scan)"
                  fi

                  report="${RUNNER_TEMP}/gitleaks-report-base.json"
                  log="${RUNNER_TEMP}/gitleaks-base.log"
                  status=0
                  gitleaks git --redact --no-banner --no-color \
                      --ignore-gitleaks-allow --exit-code 1 \
                      --log-opts="${log_opts}" \
                      --report-format json --report-path "${report}" \
                      . 2>&1 | tee "${log}" || status=$?

                  count="unknown"
                  if [ -s "${report}" ]; then
                      count="$(jq 'length' "${report}" 2>/dev/null)" || count="unknown"
                  fi
                  scanned="$(grep -Eo '[0-9]+ commits scanned' "${log}" | grep -Eo '^[0-9]+' || true)"

                  # This run walks only the base's own ancestry (or, with no
                  # base, the entire history) — either way it can never
                  # legitimately scan zero commits, so "0 commits scanned"
                  # fails closed here the same as an ERR/FTL line or an
                  # unreadable report (see header).
                  problems=()
                  if grep -Eq '\b(ERR|FTL)\b' "${log}"; then
                      problems+=("gitleaks logged an ERR/FTL line")
                  fi
                  if grep -Eq '(^|[^0-9])0 commits scanned' "${log}"; then
                      problems+=("gitleaks scanned 0 commits")
                  fi
                  if [ "${count}" = "unknown" ]; then
                      problems+=("the gitleaks report is missing or unreadable")
                  elif [ "${count}" != "0" ] && [ "${status}" -eq 0 ]; then
                      problems+=("the report holds ${count} leak(s) but gitleaks exited 0")
                  fi
                  if [ "${#problems[@]}" -gt 0 ]; then
                      for problem in "${problems[@]}"; do
                          echo "::error::Secret scan (${label}) failed closed: ${problem}"
                      done
                      if [ "${status}" -eq 0 ]; then
                          status=1
                      fi
                  fi

                  {
                      echo "## Secret scan — ${label} (gitleaks ${gitleaks_version})"
                      echo
                      echo "Commits scanned: **${scanned:-unknown}**"
                      echo "Leaks found: **${count}** (exit status ${status})"
                      for problem in "${problems[@]}"; do
                          echo "- Failed closed: ${problem}"
                      done
                      if [ "${count}" != "unknown" ] && [ "${count}" != "0" ]; then
                          echo
                          echo "Values are redacted. Fingerprints (commit:file:rule:line):"
                          echo
                          echo '```text'
                          jq -r '.[].Fingerprint' "${report}"
                          echo '```'
                      fi
                  } >> "${GITHUB_STEP_SUMMARY}"

                  exit "${status}"

            - name: Scan new range
              id: scan_range
              if: steps.base.outputs.has_base == 'true'
              shell: bash
              env:
                  BASE_SHA: ${{ steps.base.outputs.sha }}
              run: |
                  set -euo pipefail

                  gitleaks_version="$(gitleaks version)"

                  # Base-snapshot .gitleaksignore (see header): this run
                  # covers the range run 1 cannot see — commits that exist
                  # only because of this push/PR — so it is the one place a
                  # same-push secret-plus-suppression pair could ever slip
                  # through, and it reads the ignore file as it stood at the
                  # base, not the tip. gitleaks reads the file live off disk,
                  # not from a git blob, so the base's version has to land on
                  # disk: read it here and overwrite the checked-out working
                  # copy for the duration of this scan only, then restore it.
                  original_ignore="${RUNNER_TEMP}/gitleaksignore.original"
                  had_original=0
                  if [ -e .gitleaksignore ]; then
                      had_original=1
                      cp .gitleaksignore "${original_ignore}"
                  fi
                  restore_ignore() {
                      if [ "${had_original}" -eq 1 ]; then
                          cp "${original_ignore}" .gitleaksignore
                      else
                          rm -f .gitleaksignore
                      fi
                  }
                  trap restore_ignore EXIT

                  git show "${BASE_SHA}:.gitleaksignore" > .gitleaksignore 2>/dev/null || : > .gitleaksignore

                  report="${RUNNER_TEMP}/gitleaks-report-range.json"
                  log="${RUNNER_TEMP}/gitleaks-range.log"
                  status=0
                  gitleaks git --redact --no-banner --no-color \
                      --ignore-gitleaks-allow --exit-code 1 \
                      --log-opts="${BASE_SHA}..HEAD" \
                      --report-format json --report-path "${report}" \
                      . 2>&1 | tee "${log}" || status=$?

                  count="unknown"
                  if [ -s "${report}" ]; then
                      count="$(jq 'length' "${report}" 2>/dev/null)" || count="unknown"
                  fi
                  scanned="$(grep -Eo '[0-9]+ commits scanned' "${log}" | grep -Eo '^[0-9]+' || true)"

                  # Unlike run 1, "0 commits scanned" IS legitimate here: a
                  # re-push whose range collapses to nothing (for example a
                  # docs-only follow-up) walks zero new commits without any
                  # git subprocess having failed. Only the other fail-closed
                  # checks apply to this run (see header).
                  problems=()
                  if grep -Eq '\b(ERR|FTL)\b' "${log}"; then
                      problems+=("gitleaks logged an ERR/FTL line")
                  fi
                  if [ "${count}" = "unknown" ]; then
                      problems+=("the gitleaks report is missing or unreadable")
                  elif [ "${count}" != "0" ] && [ "${status}" -eq 0 ]; then
                      problems+=("the report holds ${count} leak(s) but gitleaks exited 0")
                  fi
                  if [ "${#problems[@]}" -gt 0 ]; then
                      for problem in "${problems[@]}"; do
                          echo "::error::Secret scan (new range) failed closed: ${problem}"
                      done
                      if [ "${status}" -eq 0 ]; then
                          status=1
                      fi
                  fi

                  {
                      echo "## Secret scan — new range ${BASE_SHA}..HEAD (gitleaks ${gitleaks_version})"
                      echo
                      echo "Commits scanned: **${scanned:-0}**"
                      echo "Leaks found: **${count}** (exit status ${status})"
                      for problem in "${problems[@]}"; do
                          echo "- Failed closed: ${problem}"
                      done
                      if [ "${count}" != "unknown" ] && [ "${count}" != "0" ]; then
                          echo
                          echo "Values are redacted. Fingerprints (commit:file:rule:line):"
                          echo
                          echo '```text'
                          jq -r '.[].Fingerprint' "${report}"
                          echo '```'
                          echo
                          echo "If this is a false positive: push the offending commit first, then add its .gitleaksignore entry in a follow-up push/PR — an entry added in the SAME push/PR is not honoured (it is read as it stood at the base, not the tip)."
                      fi
                  } >> "${GITHUB_STEP_SUMMARY}"

                  exit "${status}"
