name: 🚀 Release & Deploy

on:
    release:
        types: [published]

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    deploy:
        runs-on: ubuntu-latest

        permissions:
            contents: "read"
            id-token: "write"

        env:
            IMAGE_URL: ${{ vars.GCP_ARTIFACT_REGION }}-docker.pkg.dev/${{ vars.APP_NAME }}/${{ vars.APP_NAME }}/${{ vars.APP_NAME }}:${{ github.event.release.tag_name }}

        steps:
            - uses: "actions/checkout@v4"

            - name: Get Release Info
              id: release
              run: |
                  echo "VERSION=${{ github.event.release.tag_name }}" >> $GITHUB_OUTPUT
                  echo "IS_PRERELEASE=${{ github.event.release.prerelease }}" >> $GITHUB_OUTPUT

            # Authentification sécurisée via l'action officielle
            - id: "auth"
              uses: "google-github-actions/auth@v2"
              with:
                  credentials_json: "${{ secrets.GCP_SA_KEY }}"

            - name: Set up Cloud SDK
              uses: "google-github-actions/setup-gcloud@v2"

            - name: Build and Push Docker Image
              run: |
                  # 1. Configurer Docker pour GCP
                  gcloud auth configure-docker ${{ vars.GCP_ARTIFACT_REGION }}-docker.pkg.dev

                  # 2. Définir les tags (version + latest)
                  IMAGE_BASE=${{ vars.GCP_ARTIFACT_REGION }}-docker.pkg.dev/${{ vars.APP_NAME }}/${{ vars.APP_NAME }}/${{ vars.APP_NAME }}
                  IMAGE_VERSION=$IMAGE_BASE:${{ steps.release.outputs.VERSION }}
                  IMAGE_LATEST=$IMAGE_BASE:latest

                  # 3. Build avec les deux tags (version + latest)
                  docker build --target production -t $IMAGE_VERSION -t $IMAGE_LATEST .

                  # 4. Push les deux tags
                  docker push $IMAGE_VERSION
                  docker push $IMAGE_LATEST

            - name: Deploy to Cloud Run
              run: |
                  # Déployer sur Cloud Run avec l'image versionnée
                  gcloud run deploy ${{ vars.APP_NAME }} \
                    --image ${{ env.IMAGE_URL }} \
                    --region ${{ vars.GCP_ARTIFACT_REGION }} \
                    --platform managed \
                    --quiet

            - name: Run DB Migration (Production)
              run: |
                  # Mise à jour de l'image du job existant
                  gcloud run jobs deploy ${{ vars.APP_NAME }}-migrate-db \
                    --image ${{ env.IMAGE_URL }} \
                    --region ${{ vars.GCP_ARTIFACT_REGION }} \
                    --command "node" \
                    --args "ace.js,migration:run,--force"

                  # Exécution
                  gcloud run jobs execute ${{ vars.APP_NAME }}-migrate-db \
                    --region ${{ vars.GCP_ARTIFACT_REGION }} \
                    --wait
