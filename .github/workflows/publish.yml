name: Publish to JSR

on:
    release:
        types: [published]

jobs:
    publish:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            id-token: write # Requis pour JSR

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Deno
              uses: denoland/setup-deno@v2
              with:
                  deno-version: v2.x

            # 1. Vérifie que le code respecte le formatage standard
            - name: Check Formatting
              run: deno fmt --check

            # 2. Analyse statique pour trouver les erreurs courantes
            - name: Lint
              run: deno lint

            # 3. Type-check the whole workspace
            - name: Type check
              run: deno check

            # 4. Cycles, declaration drift, tier policy
            - name: Dependency integrity
              run: deno task deps:analyze

            # 5. Package briefs must match the code they describe
            - name: Agent briefs up to date
              run: deno task agents:brief --check

            # 6. Tests. `deno task test` already carries -A.
            - name: Run Tests
              run: deno task test

            # 7. THE pre-publish gate.
            #
            # `deno publish --dry-run` runs inside the workspace, where a bare
            # `@lockness/x` specifier resolves by workspace member *name*
            # whether or not the importing package declares it — so it passes
            # for a package that ships a manifest a consumer cannot resolve.
            # This check copies each package out of the workspace and proves it
            # resolves alone. It is the only step that catches that class of
            # defect before the version is permanently on JSR.
            - name: Published-shape resolution
              run: deno task publish:check

            # 8. Publie seulement si tout est vert
            - name: Publish to JSR
              run: deno publish
