name: Publish to JSR

on:
    release:
        types: [published]

jobs:
    publish:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            id-token: write # Requis pour JSR

        steps:
            - name: Checkout code
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

            - name: Setup Deno
              uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
              with:
                  deno-version: v2.x

            # The same versioned gate the pre-push hook and test.yml run
            # (#388, #396): the ordered step list lives in scripts/gate.ts
            # only, so this workflow cannot drift from it the way it did
            # before (its own hand-typed list had no docs:coverage step).
            # `--registry` asks JSR whether each package already exists there
            # for the publish:check step only. A package must be created on
            # JSR before anything can be published to it, and `deno publish`
            # is atomic across the workspace — one missing package aborts all
            # 27. This is a pre-publish check only; CI and the pre-push hook
            # run the same task without the flag.
            - name: Quality gate
              run: deno task gate --registry

            # Publish only once the gate above is green.
            - name: Publish to JSR
              run: deno publish
