name: 'Monorepo Split (Release)'

on:
  release:
    types: [published]

jobs:
  split_packages:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - core
          - auth
          - cache
          - container
          - devtools
          - events
          - logger
          - mail
          - openapi
          - queue
          - session
          - socialite
          - storage
          - validator
          - cli
          - drizzle
          - init
          - deprecation-contracts

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Split and Push ${{ matrix.package }}
        uses: symplify/monorepo-split-github-action@v2.3.0
        with:
          # The directory to split (relative to repo root)
          package_directory: 'lockness/${{ matrix.package }}'

          # The destination repository URL
          repository_host: github.com
          # Change "locknessjs" to your real GitHub organization name
          repository_organization: 'locknessjs'
          repository_name: '${{ matrix.package }}'

          # Use a Personal Access Token with 'repo' scope
          # You must add this token to your repo secrets as SPLIT_TOKEN
          user_name: 'lockness-bot'
          user_email: 'bot@lockness.land'
          github_token: ${{ secrets.SPLIT_TOKEN }}

          # Tag the split repository with the same release tag
          # This ensures the version numbers stay in sync
          branch: 'main'
          tag: ${{ github.event.release.tag_name }}
