name: Tests

on:
    pull_request:
        branches:
            - main
            - develop

jobs:
    test:
        name: Run Tests
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Deno
              uses: denoland/setup-deno@v2
              with:
                  deno-version: v2.x

            - name: Cache dependencies
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.deno
                      ~/.cache/deno
                  key: ${{ runner.os }}-deno-${{ hashFiles('**/deno.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-deno-

            - name: Lint
              run: deno lint

            - name: Type check
              run: deno check

            - name: Check formatting
              run: deno fmt --check

            - name: Dependency integrity
              run: deno task deps:analyze

            - name: Agent briefs up to date
              run: deno task agents:brief --check

            - name: Published-shape resolution
              run: deno task publish:check

            - name: Run tests
              run: deno task test
