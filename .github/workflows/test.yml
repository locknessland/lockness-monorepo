name: Tests

on:
    push:
        branches:
            - main
            - develop
    pull_request:
        branches:
            - main
            - develop
    # For the `mutations` job below, which is too slow to run per-PR and
    # detects decay that no single PR caused.
    schedule:
        - cron: '17 3 * * *'
    workflow_dispatch:

jobs:
    test:
        name: Run Tests
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                # ubuntu is the existing lane; macOS mirrors the maintainers'
                # local platform. Windows is intentionally not yet in the matrix
                # (unverified path assumptions) — tracked as follow-up.
                os: [ubuntu-latest, macos-latest]
                # Latest v2 plus a pinned floor for reproducibility.
                deno-version: ['v2.x', '2.9.6']

        steps:
            - name: Checkout code
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

            - name: Setup Deno
              uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
              with:
                  deno-version: ${{ matrix.deno-version }}

            - name: Cache dependencies
              uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
              with:
                  path: |
                      ~/.deno
                      ~/.cache/deno
                  key: ${{ runner.os }}-deno-${{ hashFiles('**/deno.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-deno-

            - name: Lint
              run: deno lint

            - name: Type check
              run: deno check

            - name: Check formatting
              run: deno fmt --check

            - name: Dependency integrity
              run: deno task deps:analyze

            - name: Agent briefs up to date
              run: deno task agents:brief --check

            - name: Module docs coverage
              run: deno task docs:coverage

            - name: Published-shape resolution
              run: deno task publish:check

            - name: Run tests (with leak tracing)
              run: deno task test:leaks

    live-redis:
        name: Live Redis integration
        runs-on: ubuntu-latest
        permissions:
            contents: read

        # A service container, so the gated suite (#273) actually RUNS somewhere.
        # Without this job nothing ever sets LOCKNESS_REDIS_INTEGRATION, the
        # suite skips forever, and "we have live-Redis coverage" quietly becomes
        # untrue while every check stays green — which is exactly the history
        # that produced #273 in the first place.
        services:
            redis:
                # 7.x is the floor: the realtime driver's EXPIRE 'NX' / 'GT'
                # option flags do not exist before Redis 7.0 and fail as no-ops.
                image: redis:7-alpine
                ports:
                    - 6379:6379
                options: >-
                    --health-cmd "redis-cli ping"
                    --health-interval 5s
                    --health-timeout 3s
                    --health-retries 10

        steps:
            - name: Checkout code
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

            - name: Setup Deno
              uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
              with:
                  deno-version: v2.x

            - name: Run the live-broker suite
              # Every LOCKNESS_REDIS_* value is set HERE, in the workflow file.
              # None of them is ever taken from anything a fork's pull request
              # can influence — the host is an outbound-connection primitive.
              env:
                  LOCKNESS_REDIS_HOST: 127.0.0.1
                  LOCKNESS_REDIS_PORT: '6379'
              # --trace-leaks here rather than in the task: the default
              # `test:leaks` job never sets the gate, so it skips every one of
              # these tests. Without this flag nothing leak-checks them at all,
              # and each test opens four sockets.
              run: deno task test:redis -- --trace-leaks

    mutations:
        name: Mutation batteries
        runs-on: ubuntu-latest
        # NIGHTLY, not per-PR. The batteries mutate a source file and re-run a
        # whole suite for every row — 15 batteries, several minutes each — so a
        # per-PR lane would dominate CI time for a signal that changes slowly.
        #
        # The decay this catches is not caused by the PR that triggers it: three
        # of the four rotted rows found in the first full sweep were broken by
        # merges that touched neither the battery nor the row's subject. So the
        # requirement is that decay in an UNTOUCHED battery is noticed without a
        # human deciding to look, which a schedule satisfies and a per-PR filter
        # by touched package does not.
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

        services:
            redis:
                image: redis:7-alpine
                ports:
                    - 6379:6379
                options: >-
                    --health-cmd "redis-cli ping"
                    --health-interval 5s
                    --health-timeout 3s
                    --health-retries 10

        steps:
            - name: Checkout code
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

            - name: Setup Deno
              uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
              with:
                  deno-version: v2.x

            # `--require-all` because this job HAS the broker: a battery that
            # refuses to start here is a fault, not an absent prerequisite.
            # Without it a missing service would read as a pass over the rows
            # that never ran — the exact inversion the batteries' own exit-2
            # gate exists to prevent.
            - name: Run every mutation battery
              env:
                  LOCKNESS_REDIS_INTEGRATION: '1'
                  LOCKNESS_REDIS_HOST: 127.0.0.1
                  LOCKNESS_REDIS_PORT: '6379'
              run: deno task mutate --require-all

    coverage:
        name: Coverage
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

            - name: Setup Deno
              uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
              with:
                  deno-version: v2.x

            - name: Cache dependencies
              uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
              with:
                  path: |
                      ~/.deno
                      ~/.cache/deno
                  key: ${{ runner.os }}-deno-cov-${{ hashFiles('**/deno.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-deno-

            # Measures line coverage across packages/ and app/, prints the
            # per-file summary to the log (surfacing) and enforces a lenient
            # global floor. The per-package ratcheting floor is tracked in #175.
            - name: Measure coverage
              run: deno task test:coverage

            - name: Enforce global coverage floor (50%)
              run: |
                  pct=$(awk -F: '/^LF:/{f+=$2} /^LH:/{h+=$2} END{if(f>0) printf "%.1f", (h/f)*100; else print "0"}' coverage/lcov.info)
                  echo "Total line coverage: ${pct}%"
                  awk -F: '/^LF:/{f+=$2} /^LH:/{h+=$2} END{exit !(f>0 && (h/f)*100 >= 50)}' coverage/lcov.info \
                    || { echo "::error::line coverage ${pct}% is below the 50% floor"; exit 1; }

            # Per-package ratcheting floor: fails if any package regressed below
            # its recorded floor in coverage-floors.json (#175).
            - name: Enforce per-package coverage floors
              run: deno task coverage:floor

    kits:
        name: Starter kits
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

            - name: Setup Deno
              uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
              with:
                  deno-version: v2.x

            - name: Cache dependencies
              uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
              with:
                  path: |
                      ~/.deno
                      ~/.cache/deno
                  key: ${{ runner.os }}-deno-kits-${{ hashFiles('**/deno.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-deno-

            # Scaffolds web, api and slim, then takes each one through
            # `deno check`, `deno task test` and a real HTTP boot. Its own job
            # rather than a step in `test`: it starts servers and installs npm
            # dependencies per scaffold, so a failure here means "the kits are
            # broken", not "the framework is broken", and the two should not
            # share a red X.
            #
            # No database is needed — every kit boots with DATABASE_URL unset,
            # and each smoke test is written to stay off the database on
            # purpose.
            - name: Scaffold, check, test and boot every kit
              run: deno task kits:smoke
